<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Library Client</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Music Library</h1>
      <p id="status">Loading tracks...</p>
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Artist</th>
            <th>Album</th>
            <th>Genre</th>
            <th>Year</th>
          </tr>
        </thead>
        <tbody id="trackRows"></tbody>
      </table>
    </main>
    <script src="app.js"></script>
  </body>
</html>
