<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Music Library Dashboard</h1>
      <p>Browse all albums from the local API prototype.</p>
    </header>

    <main>
      <div class="actions">
        <button id="reloadBtn">Reload Albums</button>
        <button id="simulateErrorBtn">Simulate API Error</button>
      </div>

      <p id="status" aria-live="polite">Loading albums...</p>
      <section id="albumGrid" class="grid"></section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
